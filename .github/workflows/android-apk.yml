name: Build HAO APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - run: mkdir -p release
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk release/hao-debug.apk
      - run: cd android && zip -r ../release/hao-android-source.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: hao-apk-and-source
          path: release/
