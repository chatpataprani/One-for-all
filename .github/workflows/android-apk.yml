name: Build HAO APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAO_BACKEND_URL: ${{ secrets.HAO_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android assembleDebug
      - name: Package release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/hao-debug.apk
          cd android && zip -r ../release/hao-android-source.zip . -x '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: hao-apk-and-source
          path: release/
