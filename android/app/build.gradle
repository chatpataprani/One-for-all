plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.chatpataprani.hao'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig {
        applicationId 'com.chatpataprani.hao'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '4.3'
    }
}

def haoIconResDir = file("$buildDir/generated/res/haoIcon")

android.sourceSets.main.res.srcDir(haoIconResDir)

def prepareHaoIcon = tasks.register("prepareHaoIcon") {
    inputs.file("$rootDir/icon/hao_icon.webp.b64")
    outputs.file("$haoIconResDir/drawable-nodpi/hao_icon.webp")
    doLast {
        def source = file("$rootDir/icon/hao_icon.webp.b64")
        def outDir = file("$haoIconResDir/drawable-nodpi")
        outDir.mkdirs()
        def data = java.util.Base64.decoder.decode(source.text.trim())
        file("$outDir/hao_icon.webp").bytes = data
    }
}

tasks.configureEach {
    if (name.startsWith("merge") && name.endsWith("Resources")) {
        dependsOn(prepareHaoIcon)
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
