name: Build One-for-all
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: cd dist && zip -r ../one-for-all-build.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: one-for-all-build
          path: one-for-all-build.zip
