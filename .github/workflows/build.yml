name: Build HAO
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.js
      - run: node --check api/lookup.js
      - run: node --check server.mjs
      - run: mkdir -p build/api
      - run: cp index.html app.js styles.css package.json server.mjs vercel.json README.md build/
      - run: cp api/lookup.js build/api/
      - run: cd build && zip -r ../hao-api-search.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: hao-api-search
          path: hao-api-search.zip
